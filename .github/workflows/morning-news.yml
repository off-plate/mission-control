name: Morning news

# Pulls one real EN and one real CZ AI-news headline each morning (Google News RSS,
# no API key), rebuilds the site so docs/data/morning.json updates, and commits.

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC ~ 07:00 Prague, before the morning routine
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: morning-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-morning-news.mjs
      - run: npm run build
      - name: Commit if changed
        run: |
          git config user.name "morning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/morning.json docs
          if git diff --cached --quiet; then
            echo "No change today."
          else
            git commit -m "morning news: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi
