name: Health sync

# Pulls wellness and activities from Intervals.icu into Supabase, every two
# hours, exactly as off-plate/zepp-health did before this moved here on
# 2026-09-11 at his instruction to ditch that repo.
#
# The pull itself is NOT in this file. It is the `zepp-sync` Edge Function,
# which the app's Sync button calls too, so there is one implementation rather
# than a cron copy and a button copy free to drift apart. This workflow only
# presses the same button on a timer.
#
# The URL and publishable key below are already in the app's public bundle.
# What proves this caller is the cron is ZEPP_CRON_SECRET, a repo secret that
# the function checks on x-cron-secret (2026-10-04: before that, anyone with
# the public key could trigger a 400-day pull). The Intervals key lives only in
# Supabase secrets.

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours, the cadence it already ran at
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of history to pull'
        required: false
        default: '60'

concurrency:
  group: health-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the sync function
        env:
          CRON_SECRET: ${{ secrets.ZEPP_CRON_SECRET }}
          DAYS: ${{ github.event.inputs.lookback_days || '60' }}
        run: |
          set -euo pipefail
          URL="https://fhfempisopwsdkmvywbt.supabase.co/functions/v1/zepp-sync"
          KEY="sb_publishable_MDxQPm0SzLHFTnDqg-eyyQ_0yposnES"
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            -X POST "$URL" \
            -H "Authorization: Bearer $KEY" \
            -H "apikey: $KEY" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            -d "{\"lookback_days\": $DAYS}")
          echo "HTTP $code"
          cat /tmp/out.json
          echo
          # A 200 carrying ok:false is still a failed sync. Without this the
          # schedule would show green over a dead pipeline, which is the exact
          # failure the Health page is supposed to make impossible to miss.
          test "$code" = "200"
          grep -q '"ok":true' /tmp/out.json
