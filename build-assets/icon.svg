<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Ground: the app's ink, so the mark holds at 32px in the dock against a
       light desktop. Paper ground would vanish there. -->
  <rect width="1024" height="1024" rx="228" fill="#1a1712"/>
  <!-- A hairline of paper, the same device the app uses instead of shadows. -->
  <rect x="8" y="8" width="1008" height="1008" rx="220" fill="none" stroke="#f4efe4" stroke-opacity="0.10" stroke-width="16"/>
  <g stroke="#d1502a" stroke-width="52" stroke-linecap="round" fill="none">
    <circle cx="512" cy="512" r="248"/>
    <path d="M512 128v128M512 768v128M128 512h128M768 512h128"/>
  </g>
  <circle cx="512" cy="512" r="86" fill="#d1502a"/>
</svg>
