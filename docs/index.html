<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FAF8F4" />
    <meta name="description" content="Mission Control. One place to see and run your life. Demo build with mock data." />
    <title>Mission Control</title>
    <!-- Installable from Safari's Share > Add to Home Screen (2026-10-15). A
         plain bookmark-style home screen icon kept losing its login; an
         installed web app keeps its own storage and is exempt from Safari's
         7-day clean-up of site data. -->
    <link rel="manifest" href="/mission-control/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/mission-control/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mission" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23D1502A' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23D1502A'/%3E%3Cpath d='M16 1v7M16 24v7M1 16h7M24 16h7' stroke='%23D1502A' stroke-width='3'/%3E%3C/svg%3E" />
    <!-- The Zone's own two faces, and only the Zone's: Array draws the
         countdown as a dot-matrix instrument, Technor sets everything around
         it. Self-hosted (public/fonts, 49KB for all three cuts, @font-face in
         styles.css) rather than fetched from Fontshare at runtime. Their CSS
         endpoint returned a 500 during a gate run, and a third-party blip
         there means the room silently loses its identity and renders in
         system fonts. Preloaded because the countdown is the one glyph that
         must not swap in late. -->
    <link rel="preload" href="/mission-control/fonts/array-400.woff2" as="font" type="font/woff2" crossorigin />
    <script type="module" crossorigin src="/mission-control/assets/index-BAAFtg1m.js"></script>
    <link rel="modulepreload" crossorigin href="/mission-control/assets/vendor_react-BRnhmgIC.js">
    <link rel="modulepreload" crossorigin href="/mission-control/assets/vendor_supabase-DECvRwsC.js">
    <link rel="stylesheet" crossorigin href="/mission-control/assets/index-DQZ4Kt-I.css">
  </head>
  <body>
    <!-- Launch screen, phone only. It lives OUTSIDE #root on purpose: React replaces #root's contents on its
         first render, and the Nothing app is a lazy chunk, so a splash inside #root left a blank gap. This one
         stays until the Nothing app has drawn (src/splash.ts reports the real steps), then the dots collapse. -->
    <style>
      @font-face { font-family: 'Doto'; src: url('/mission-control/fonts/doto-var-latin.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: block; }
      #mc-splash { display: none; }
      @media (max-width: 639px) {
        #mc-splash {
          --bg: #E8E8E8; --fg: #0A0A0A; --dim: #8A8A8A; --off: rgba(10, 10, 10, 0.13); --red: #D71921;
          display: flex; flex-direction: column; position: fixed; inset: 0; z-index: 2147483000; background: var(--bg); color: var(--fg);
          padding: max(env(safe-area-inset-top, 0px), 18px) 22px max(env(safe-area-inset-bottom, 0px), 22px);
          font: 700 11px/1 'Space Mono', ui-monospace, Menlo, monospace; letter-spacing: 0.1em; text-transform: uppercase;
          transition: opacity 200ms ease-out; touch-action: none;
        }
        #mc-splash[data-t="dark"] { --bg: #000000; --fg: #F2F2F2; --dim: #7C7C7C; --off: rgba(242, 242, 242, 0.14); }
        #mc-splash.out { opacity: 0; pointer-events: none; }
        .mcs-top { display: flex; justify-content: space-between; color: var(--dim); }
        .mcs-top b { color: var(--fg); font-weight: 700; }
        .mcs-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
        .mcs-grid { width: min(76vw, 310px); aspect-ratio: 1; display: grid; grid-template-columns: repeat(25, 1fr); opacity: 0; animation: mcs-in 420ms cubic-bezier(0.23, 1, 0.32, 1) 60ms forwards; }
        .mcs-grid i { display: block; width: 100%; aspect-ratio: 1; position: relative; }
        .mcs-grid i.d::after { content: ''; position: absolute; inset: 22%; border-radius: 50%; background: var(--fg); opacity: 0.14; transform: scale(0.8); animation: mcs-sweep 2.2s linear infinite; animation-delay: calc(var(--a) * 2.2s); }
        .mcs-grid i.c::after { background: var(--red); opacity: 1; transform: none; animation: mcs-beat 1.1s ease-in-out infinite; animation-delay: 0s; }
        #mc-splash.out .mcs-grid i.d::after { animation: mcs-out 200ms cubic-bezier(0.23, 1, 0.32, 1) forwards; animation-delay: calc(var(--r) * 60ms); }
        .mcs-word { font: 800 21px/1 'Doto', 'Space Mono', monospace; letter-spacing: 0.16em; text-align: center; }
        .mcs-read { display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .mcs-pct { font: 900 64px/1 'Doto', 'Space Mono', monospace; letter-spacing: 0.02em; min-width: 4ch; text-align: center; }
        .mcs-bar { display: flex; gap: 6px; }
        .mcs-bar i { width: 7px; height: 7px; border-radius: 50%; background: var(--off); transition: background-color 160ms ease-out, transform 160ms cubic-bezier(0.23, 1, 0.32, 1); }
        .mcs-bar i.on { background: var(--fg); }
        .mcs-bar i.lead { background: var(--red); transform: scale(1.25); }
        @keyframes mcs-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
        @keyframes mcs-sweep {
          0% { opacity: 1; transform: scale(1.3); background: var(--red); }
          4% { opacity: 1; transform: scale(1.15); background: var(--fg); }
          30% { opacity: 0.14; transform: scale(0.8); background: var(--fg); }
          100% { opacity: 0.14; transform: scale(0.8); background: var(--fg); }
        }
        @keyframes mcs-beat { 50% { transform: scale(0.55); opacity: 0.55; } }
        @keyframes mcs-out { to { opacity: 0; transform: scale(0.2); } }
        @media (prefers-reduced-motion: reduce) {
          .mcs-grid i.d::after { animation: none; opacity: 0.3; }
          .mcs-grid i.c::after { animation: none; }
          #mc-splash.out .mcs-grid i.d::after { animation: none; opacity: 0; }
        }
      }
    </style>
    <div id="mc-splash" role="status" aria-label="Loading Mission Control">
      <div class="mcs-top"><span id="mcs-st"><b>Starting</b></span><span id="mcs-date"></span></div>
      <div class="mcs-mid">
        <div class="mcs-grid" id="mcs-grid" aria-hidden="true"></div>
        <div class="mcs-word" aria-hidden="true">MISSION CONTROL</div>
        <div class="mcs-read" aria-hidden="true"><div class="mcs-pct" id="mcs-pct">0%</div><div class="mcs-bar" id="mcs-bar"></div></div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('mc-splash');
        var none = { set: function () {}, done: function () {} };
        if (!el || !matchMedia('(max-width: 639px)').matches) { if (el) el.remove(); window.mcSplash = none; return; }
        try { if (localStorage.getItem('mc:skin') === 'nothing-dark') el.setAttribute('data-t', 'dark'); } catch (e) {}
        /* The glyph: 25 x 25 cells, the ones inside the circle are dots. --a is how far round the circle a dot sits
           (0 at the top, clockwise), --r how far out: the sweep and the collapse are both just delays off those. */
        var N = 25, C = 12, html = '';
        for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
          var dx = x - C, dy = y - C, r = Math.sqrt(dx * dx + dy * dy);
          if (r > 12.3) { html += '<i></i>'; continue; }
          var a = (Math.atan2(dx, -dy) / (2 * Math.PI) + 1) % 1;
          html += '<i class="d' + (r < 1.6 ? ' c' : '') + '" style="--a:' + a.toFixed(3) + ';--r:' + (r / 12.3).toFixed(3) + '"></i>';
        }
        document.getElementById('mcs-grid').innerHTML = html;
        var bar = document.getElementById('mcs-bar'), BARN = 24, bh = '';
        for (var i = 0; i < BARN; i++) bh += '<i></i>';
        bar.innerHTML = bh;
        var dots = bar.children, pct = document.getElementById('mcs-pct'), st = document.getElementById('mcs-st');
        var d = new Date(), DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'], MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        document.getElementById('mcs-date').textContent = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];
        var target = 8, shown = 0, fin = false, ended = false, lastN = -1, lastT = '';
        function label(p) { return p >= 100 ? 'Ready' : p < 30 ? 'Starting' : p < 62 ? 'Reading your day' : 'Opening'; }
        function paint() {
          var n = Math.min(BARN, Math.round(shown / 100 * BARN));
          if (n !== lastN) { for (var i = 0; i < BARN; i++) dots[i].className = i < n ? (i === n - 1 && n < BARN ? 'on lead' : 'on') : ''; lastN = n; }
          pct.textContent = Math.round(shown) + '%';
          var t = label(Math.round(shown)); if (t !== lastT) { st.innerHTML = '<b>' + t + '</b>'; lastT = t; }
        }
        function out() {
          if (ended) return; ended = true; el.classList.add('out');
          setTimeout(function () { el.remove(); }, 450);
        }
        function frame() {
          /* The number always moves, so a slow cloud read never looks frozen, but it stops short of the end
             until the Nothing app has really drawn. */
          if (!fin) target = Math.min(94, target + 0.05);
          shown += (target - shown) * 0.09;
          if (fin) { shown = 100; paint(); setTimeout(out, 60); return; }
          paint(); requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        window.mcSplash = {
          set: function (p) { if (!fin && p > target) target = Math.min(p, 96); },
          done: function () { if (fin) return; fin = true; target = 100; },
        };
        setTimeout(function () { window.mcSplash.done(); }, 6000); /* never trap him behind it */
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
