<!doctype html><meta charset="utf-8"><title>MyMind options</title>
<style>
  body { max-width: 460px; margin: 40px auto; padding: 0 16px; font: 15px/1.5 system-ui, -apple-system, sans-serif; color: #14181b; background: #f3f5f4 }
  input { width: 100%; font: inherit; padding: 9px 11px; border: 0; border-radius: 8px; box-shadow: inset 0 0 0 1px #d8dedb; background: #fff }
  button { font: inherit; font-weight: 600; padding: 9px 14px; border: 0; border-radius: 8px; background: #dff24a; cursor: pointer; margin-top: 10px }
  p { color: #56626b }
</style>
<h2>MyMind key</h2>
<p>Paste the MyMind key once. It stays in this browser's extension storage, nowhere else.</p>
<input id="k" type="password" autocomplete="off" aria-label="MyMind key">
<button id="s">Save key</button> <span id="m"></span>
<script src="options.js"></script>
