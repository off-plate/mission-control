<!doctype html><meta charset="utf-8">
<style>
  :root { --ink:#14181b; --muted:#56626b; --paper:#f3f5f4; --card:#fff; --accent:#dff24a; --alert:#c8402f; --ok:#2d7d52; }
  * { box-sizing: border-box }
  body { width: 340px; margin: 0; padding: 14px; background: var(--paper); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, sans-serif }
  label { display: block; margin: 10px 0 4px; font-size: 12px; color: var(--muted) }
  input, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 0; border-radius: 8px; background: var(--card); box-shadow: inset 0 0 0 1px #d8dedb; color: var(--ink) }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px }
  .row { display: flex; gap: 8px; margin-top: 12px; align-items: center }
  button { font: inherit; font-weight: 600; padding: 9px 14px; border: 0; border-radius: 8px; background: var(--accent); color: var(--ink); cursor: pointer }
  button[disabled] { opacity: .5; cursor: default }
  #msg { font-size: 13px; color: var(--muted) } #msg.ok { color: var(--ok) } #msg.err { color: var(--alert) }
  .site { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
</style>
<div class="site" id="site"></div>
<label for="t">Title</label><input id="t" autocomplete="off">
<label for="n">Note</label><textarea id="n" rows="2" placeholder="Why you saved it"></textarea>
<div class="row"><button id="go">Save to MyMind</button><span id="msg"></span></div>
<script src="lib.js"></script><script src="popup.js"></script>
