<!doctype html><meta charset="utf-8">
<style>
  :root { --ink:#14181b; --muted:#56626b; --paper:#f3f5f4; --accent:#dff24a; --ok:#2d7d52; --alert:#c8402f; }
  * { box-sizing: border-box }
  body { width: 300px; margin: 0; padding: 22px 20px 18px; background: var(--paper); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, sans-serif; text-align: center; overflow: hidden }
  .stage { width: 76px; height: 76px; margin: 0 auto 12px; position: relative }
  .stage svg { width: 100%; height: 100%; display: block; overflow: visible }
  .track { fill: none; stroke: #dfe5e2; stroke-width: 5 }
  .ring { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 60 140; transform-origin: 50% 50%; animation: spin .9s linear infinite }
  .mark { position: absolute; inset: 0; display: grid; place-items: center }
  .mark svg { width: 30px; height: 30px; fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; animation: breathe 1.1s ease-in-out infinite }
  .check { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60 }
  body.ok .ring { animation: fill .45s cubic-bezier(.2,.8,.2,1) forwards; stroke: var(--ok); stroke-dasharray: 189 189 }
  body.ok .disc { animation: pop .45s cubic-bezier(.2,.8,.2,1) forwards }
  body.ok .mark { display: none }
  body.ok .check { animation: draw .35s .25s cubic-bezier(.2,.8,.2,1) forwards }
  body.err .ring { animation: none; stroke: var(--alert); stroke-dasharray: 189 189 }
  body.err .mark svg { animation: none; stroke: var(--alert) }
  .disc { fill: var(--accent); transform-origin: 50% 50%; transform: scale(0) }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes breathe { 50% { transform: scale(.86) } }
  @keyframes fill { from { stroke-dasharray: 60 140 } to { stroke-dasharray: 189 189 } }
  @keyframes pop { to { transform: scale(1) } }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  #head { font-weight: 700; font-size: 16px }
  #sub { margin-top: 3px; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  body.err #sub { white-space: normal; color: var(--alert) }
  #retry { display: none; margin-top: 12px; font: inherit; font-weight: 600; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: var(--ink); cursor: pointer }
  body.err #retry { display: inline-block }
  #retry:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
  .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--ink); transform-origin: left; transform: scaleX(0); opacity: 0 }
  body.ok .bar { opacity: .12; animation: drain 1.5s linear forwards }
  @keyframes drain { from { transform: scaleX(1) } to { transform: scaleX(0) } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; animation-delay: 0s !important } }
</style>
<div class="stage">
  <svg viewBox="0 0 76 76" aria-hidden="true">
    <circle class="disc" cx="38" cy="38" r="33"/>
    <circle class="track" cx="38" cy="38" r="30"/>
    <circle class="ring" cx="38" cy="38" r="30"/>
    <path class="check" d="M25 39 L34 48 L52 28"/>
  </svg>
  <div class="mark"><svg viewBox="0 0 24 24"><path d="M9 4h6a2 2 0 0 1 2 2v14l-5-3-5 3V6a2 2 0 0 1 2-2z"/></svg></div>
</div>
<div id="head" role="status" aria-live="polite">Saving to MyMind</div>
<div id="sub"></div>
<button id="retry">Try again</button>
<div class="bar"></div>
<script src="lib.js"></script><script src="popup.js"></script>
